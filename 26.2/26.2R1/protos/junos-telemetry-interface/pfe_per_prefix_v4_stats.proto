//
// This proto file is used to decode the data for the following native config paths
// /junos/services/ipv4-unicast/prefix/usage/
//

syntax = "proto2";

import "telemetry_top.proto";

extend JuniperNetworksSensors {
   optional network_instances_pfe_per_prefix_v4 jnpr_network_instances_pfe_per_prefix_v4_ext = 143;
}

message network_instances_pfe_per_prefix_v4 {
   message network_instance_list {
      optional string name = 49 [(telemetry_options).is_key = true];
      optional afts_type afts = 149;
      message afts_type {
         optional ipv4_unicast_type ipv4_unicast = 149;
         message ipv4_unicast_type {
            message ipv4_entry_list {
               optional string prefix = 49 [(telemetry_options).is_key = true];
               optional state_type state = 149;
               message state_type {
                  optional counters_type counters = 149;
                  message counters_type {
                     optional uint64 packets_forwarded = 49 [(telemetry_options).is_counter = true];
                     optional uint64 octets_forwarded = 50 [(telemetry_options).is_counter = true];
                  }
               }
            }
            repeated ipv4_entry_list ipv4_entry = 149;
         }
      }
   }
   repeated network_instance_list network_instance = 149;
}
